[workspace]
members = ["crates/tolk-inspect-core", "crates/tolk-inspect-wasm"]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
js-sys = "=0.3.105"
tolk-resolver = { git = "https://github.com/ton-blockchain/acton", tag = "v1.2.1" }
tolk-syntax = { git = "https://github.com/ton-blockchain/acton", tag = "v1.2.1" }
tolk-ty = { git = "https://github.com/ton-blockchain/acton", tag = "v1.2.1" }
tolk-analysis = { git = "https://github.com/ton-blockchain/acton", tag = "v1.2.1" }
tolk-dataflow = { git = "https://github.com/ton-blockchain/acton", tag = "v1.2.1" }
tolk-linter = { git = "https://github.com/ton-blockchain/acton", tag = "v1.2.1" }
tree-sitter = "=0.26.12"
tree-sitter-language = "=0.1.7"
wasm-bindgen = "=0.2.128"
serde-wasm-bindgen = "0.6.5"
